
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart College Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: white;
            text-align: center;
            padding: 50px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 40px #2223;
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            color: #6246c7;
            font-size: 32px;
        }

        p {
            color: #555;
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            margin: 15px 7px 0;
            padding: 13px 28px;
            border-radius: 10px;
            background: #6246c7;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #49339c;
        }

        .register {
            background: #0d9488;
        }

        .register:hover {
            background: #0f766e;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🎓</div>

        <h1>AI Smart College Assistant</h1>

        <p>
            Your smart college companion!
            Get college notices, assignments, timetable
            and academic information in one place.
        </p>

        <a class="btn" href="{% url 'login' %}">Login</a>

        <a class="btn register" href="{% url 'register' %}">
            Register
        </a>
    </div>
</body>
</html>
